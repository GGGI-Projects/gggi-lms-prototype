<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Sign Up - GGGI EcoLearn</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-secondary-fixed-variant": "#24502c",
              "surface-container-highest": "#e2e2e2",
              "surface-container": "#eeeeee",
              "on-primary-container": "#cbffc2",
              "on-primary-fixed-variant": "#005312",
              "tertiary-fixed-dim": "#a9c7ff",
              "surface-container-high": "#e8e8e8",
              "surface-container-lowest": "#ffffff",
              "outline-variant": "#bfcaba",
              "surface-bright": "#f9f9f9",
              "error-container": "#ffdad6",
              "on-tertiary-fixed": "#001b3d",
              "inverse-primary": "#88d982",
              secondary: "#3c6842",
              tertiary: "#0054a7",
              "secondary-container": "#bdefbe",
              "on-secondary-container": "#426e47",
              "on-primary-fixed": "#002204",
              "on-surface": "#1a1c1c",
              "on-tertiary": "#ffffff",
              "on-secondary-fixed": "#002109",
              surface: "#f9f9f9",
              "on-background": "#1a1c1c",
              "surface-container-low": "#f3f3f3",
              "secondary-fixed": "#bdefbe",
              background: "#f9f9f9",
              "tertiary-fixed": "#d6e3ff",
              "secondary-fixed-dim": "#a2d3a4",
              "on-secondary": "#ffffff",
              outline: "#707a6c",
              "on-tertiary-container": "#edf1ff",
              "surface-dim": "#dadada",
              "primary-container": "#2e7d32",
              "inverse-surface": "#2f3131",
              "on-error": "#ffffff",
              "on-surface-variant": "#40493d",
              "surface-variant": "#e2e2e2",
              "tertiary-container": "#246dc8",
              "primary-fixed": "#a3f69c",
              "on-tertiary-fixed-variant": "#00468c",
              "on-primary": "#ffffff",
              "primary-fixed-dim": "#88d982",
              primary: "#0d631b",
              "surface-tint": "#1b6d24",
              "on-error-container": "#93000a",
              "inverse-on-surface": "#f1f1f1",
              error: "#ba1a1a",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "margin-mobile": "16px",
              "container-max": "1280px",
              gutter: "24px",
              "margin-desktop": "32px",
              base: "8px",
            },
            fontFamily: {
              "body-md": ["Inter"],
              "display-lg": ["Inter"],
              "label-lg": ["Inter"],
              "label-md": ["Inter"],
              "title-lg": ["Inter"],
              "headline-lg": ["Inter"],
              "headline-lg-mobile": ["Inter"],
              "body-lg": ["Inter"],
            },
            fontSize: {
              "body-md": [
                "14px",
                {
                  lineHeight: "20px",
                  letterSpacing: "0.25px",
                  fontWeight: "400",
                },
              ],
              "display-lg": [
                "57px",
                {
                  lineHeight: "64px",
                  letterSpacing: "-0.25px",
                  fontWeight: "700",
                },
              ],
              "label-lg": [
                "14px",
                {
                  lineHeight: "20px",
                  letterSpacing: "0.1px",

                },
              ],
              "label-md": [
                "12px",
                {
                  lineHeight: "16px",

                },
              ],
              "title-lg": [
                "22px",
                {
                  lineHeight: "28px",
                  letterSpacing: "0px",
                  fontWeight: "500",
                },
              ],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "0px",
                  fontWeight: "600",
                },
              ],
              "headline-lg-mobile": [
                "28px",
                {
                  lineHeight: "36px",
                  letterSpacing: "0px",
                  fontWeight: "600",
                },
              ],
              "body-lg": [
                "16px",
                {
                  lineHeight: "24px",
                  letterSpacing: "0.5px",
                  fontWeight: "400",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      .elevation-1 {
        box-shadow:
          0px 1px 3px rgba(0, 0, 0, 0.12),
          0px 1px 2px rgba(0, 0, 0, 0.24);
      }
      .elevation-2 {
        box-shadow:
          0px 3px 6px rgba(0, 0, 0, 0.16),
          0px 3px 6px rgba(0, 0, 0, 0.23);
      }
    </style>
  </head>
  <body
    class="bg-surface-container-lowest min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop text-on-surface font-body-md"
  >
    <!-- Transactional page: Nav shell suppressed as per rules -->
    <main class="w-full max-w-md mx-auto">
      <div
        class="bg-surface-container-lowest elevation-1 rounded-2xl p-8 md:p-12 w-full flex flex-col items-center border border-outline-variant"
      >
        <div class="mb-8 text-center w-full">
          <span class="material-symbols-outlined text-primary mb-4 text-5xl"
            >eco</span
          >
          <h1
            class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2"
          >
            Create Your Account
          </h1>
          <p class="font-body-md text-body-md text-on-surface-variant">
            Join GGGI EcoLearn and start your sustainability journey today.
          </p>
        </div>
        <form class="w-full space-y-6">
          <!-- Full Name Field -->
          <div>
            <label
              class="block font-label-md text-label-md text-on-surface-variant mb-1"
              for="fullName"
              >Full Name</label
            >
            <div class="relative">
              <input
                class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
                id="fullName"
                placeholder="e.g. Jane Doe"
                type="text"
              />
            </div>
          </div>
          <!-- Email Field -->
          <div>
            <label
              class="block font-label-md text-label-md text-on-surface-variant mb-1"
              for="email"
              >Email</label
            >
            <div class="relative">
              <input
                class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
                id="email"
                placeholder="name@example.com"
                type="email"
              />
            </div>
          </div>
          <!-- Password Field -->
          <div>
            <label
              class="block font-label-md text-label-md text-on-surface-variant mb-1"
              for="password"
              >Password</label
            >
            <div class="relative">
              <input
                class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 pr-10 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
                id="password"
                placeholder="••••••••"
                type="password"
              />
              <button
                class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors"
                type="button"
              >
                <span class="material-symbols-outlined" data-icon="visibility"
                  >visibility</span
                >
              </button>
            </div>
          </div>
          <!-- Confirm Password Field -->
          <div>
            <label
              class="block font-label-md text-label-md text-on-surface-variant mb-1"
              for="confirmPassword"
              >Confirm Password</label
            >
            <div class="relative">
              <input
                class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 pr-10 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
                id="confirmPassword"
                placeholder="••••••••"
                type="password"
              />
              <button
                class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors"
                type="button"
              >
                <span class="material-symbols-outlined" data-icon="visibility"
                  >visibility</span
                >
              </button>
            </div>
          </div>
          <!-- Create Account Button -->
          <button
            class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-3 px-6 rounded-full elevation-1 hover:elevation-2 hover:bg-surface-tint transition-all active:scale-95"
            onclick="event.preventDefault(); window.location.href='student-verify-email.html'"
            type="submit"
          >
            Create Account
          </button>
          <div class="relative flex items-center py-2">
            <div class="flex-grow border-t border-outline-variant"></div>
            <span
              class="flex-shrink-0 mx-4 font-body-md text-body-md text-on-surface-variant"
              >or</span
            >
            <div class="flex-grow border-t border-outline-variant"></div>
          </div>
          <!-- Google Sign Up -->
          <button
            class="w-full bg-surface-container-lowest border border-[#BDBDBD] text-primary font-label-lg text-label-lg py-3 px-6 rounded-full flex items-center justify-center gap-3 hover:bg-surface-container-low transition-colors active:scale-95"
            onclick="window.location.href='student-dashboard.html'"
            type="button"
          >
            <svg
              class="w-5 h-5"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              ></path>
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              ></path>
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                fill="#FBBC05"
              ></path>
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              ></path>
            </svg>
            Sign up with Google
          </button>
        </form>
        <div class="mt-8 text-center">
          <p class="font-body-md text-body-md text-on-surface-variant">
            Already have an account?
            <a
              class="font-label-lg text-label-lg text-primary hover:underline transition-all"
              href="student-login.html"
              >Login</a
            >
          </p>
        </div>
      </div>
    </main>
  </body>
</html>

        </h1>

        <!-- Score Circle -->
        <div class="relative flex items-center justify-center mb-8">
          <!-- SVG Ring -->
          <svg class="w-40 h-40 transform -rotate-90" viewBox="0 0 100 100">
            <circle
              class="text-surface-container-highest"
              cx="50"
              cy="50"
              fill="none"
              r="45"
              stroke="currentColor"
              stroke-width="8"
            ></circle>
            <!-- 90% is 283 * 0.9 = 254.7 dasharray, 283 circumference -->
            <circle
              class="text-primary"
              cx="50"
              cy="50"
              fill="none"
              r="45"
              stroke="currentColor"
              stroke-dasharray="283"
              stroke-dashoffset="28.3"
              stroke-linecap="round"
              stroke-width="8"
            ></circle>
          </svg>
          <div
            class="absolute inset-0 flex flex-col items-center justify-center"
          >
            <span
              class="font-display-lg text-display-lg text-primary tracking-tight"
              >90<span class="text-title-lg">%</span></span
            >
          </div>
        </div>
        <!-- Status & Summary -->
        <div
          class="bg-secondary-container rounded-lg px-6 py-4 w-full mb-8 flex flex-col items-center gap-2"
        >
          <div class="flex items-center gap-2">
            <span
              class="material-symbols-outlined fill text-on-secondary-container"
              >check_circle</span
            >
            <span
              class="font-title-lg text-title-lg text-on-secondary-container font-semibold"
              >Status: Passed</span
            >
          </div>
          <p class="font-label-lg text-label-lg text-on-secondary-container/80">
            9/10 Correct
          </p>
        </div>
        <!-- Action Buttons -->
        <div class="w-full flex flex-col gap-3">
          <button
            class="w-full bg-primary text-on-primary elevation-1 hover:elevation-2 hover:bg-surface-tint font-label-lg text-label-lg rounded-full py-3 px-4 transition-all active:scale-95 flex items-center justify-center gap-2"
            onclick="window.location.href = 'student-learning-view.html'"
          >
            Continue to Module
            <span class="material-symbols-outlined text-[20px]"
              >arrow_forward</span
            >
          </button>
          <button
            class="w-full bg-surface-container-lowest border border-[#BDBDBD] text-primary hover:bg-surface-container-low font-label-lg text-label-lg rounded-full py-3 px-4 transition-colors active:scale-95 flex items-center justify-center gap-2"
            onclick="window.location.href = 'student-quiz-view.html'"
          >
            <span class="material-symbols-outlined text-[20px]">refresh</span>
            Retry Quiz
          </button>
        </div>
      </div>
    </main>
    <!-- Confetti Script -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById("confetti-container");
        const colors = ["#0d631b", "#88d982", "#bdefbe", "#a3f69c"]; // primary, inverse, secondary-container, primary-fixed
        const numConfetti = 50;

        for (let i = 0; i < numConfetti; i++) {
          const confetti = document.createElement("div");
          confetti.classList.add("confetti-piece");

          // Randomize properties
          const left = Math.random() * 100;
          const animDuration = 3 + Math.random() * 4; // 3 to 7 seconds
          const animDelay = Math.random() * 5;
          const size = 6 + Math.random() * 8;
          const color = colors[Math.floor(Math.random() * colors.length)];
          const shape = Math.random() > 0.5 ? "50%" : "0%"; // mix of circles and squares

          confetti.style.left = `${left}vw`;
          confetti.style.width = `${size}px`;
          confetti.style.height = `${size}px`;
          confetti.style.backgroundColor = color;
          confetti.style.borderRadius = shape;
          confetti.style.animationDuration = `${animDuration}s`;
          confetti.style.animationDelay = `${animDelay}s`;

          container.appendChild(confetti);
        }
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" style="">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>GGGI EcoLearn - Quiz View</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link

      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />

              "on-tertiary-fixed": "#001b3d",

              secondary: "#3c6842",
              tertiary: "#0054a7",
              "secondary-container": "#bdefbe",
              "on-secondary-container": "#426e47",
              "on-primary-fixed": "#002204",
              "on-surface": "#1a1c1c",
              "on-tertiary": "#ffffff",
              "on-secondary-fixed": "#002109",
              surface: "#f9f9f9",
              "on-background": "#1a1c1c",
              "surface-container-low": "#f3f3f3",
              "secondary-fixed": "#bdefbe",
              background: "#f9f9f9",
              "tertiary-fixed": "#d6e3ff",
              "secondary-fixed-dim": "#a2d3a4",
              "on-secondary": "#ffffff",
              outline: "#707a6c",
              "on-tertiary-container": "#edf1ff",
              "surface-dim": "#dadada",
              "primary-container": "#2e7d32",
              "inverse-surface": "#2f3131",
              "on-error": "#ffffff",
              "on-surface-variant": "#40493d",
              "surface-variant": "#e2e2e2",
              "tertiary-container": "#246dc8",
              "primary-fixed": "#a3f69c",
              "on-tertiary-fixed-variant": "#00468c",
              "on-primary": "#ffffff",
              "primary-fixed-dim": "#88d982",
              primary: "#0d631b",
              "surface-tint": "#1b6d24",
              "on-error-container": "#93000a",

            borderRadius: {

              full: "9999px",

            spacing: {

              gutter: "24px",
              "margin-desktop": "32px",
              base: "8px",
            },
            fontFamily: {
              "body-md": ["Inter"],
              "display-lg": ["Inter"],
              "label-lg": ["Inter"],
              "label-md": ["Inter"],
              "title-lg": ["Inter"],

            },
            fontSize: {

    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      [data-weight="fill"] .material-symbols-outlined {
        font-variation-settings: "FILL" 1;
      }

      /* Custom styles for radio cards to make the whole card clickable */
      .radio-card-input:checked + .radio-card-content {
        border-color: #0d631b; /* primary */
        background-color: #f3f3f3; /* surface-container-low, slightly tinted in real use */
        box-shadow:
          0px 2px 6px rgba(0, 0, 0, 0.1),
          0px 1px 3px rgba(13, 99, 27, 0.1);
      }
      .radio-card-input:checked + .radio-card-content .radio-circle {
        border-color: #0d631b;
        background-color: #0d631b;
      }
      .radio-card-input:checked + .radio-card-content .radio-circle::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #ffffff;
      }
      .radio-card-input:focus-visible + .radio-card-content {
        outline: 2px solid #0d631b;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body
    class="bg-background text-on-background min-h-screen flex flex-col font-body-md"
  >
    <!-- Top Navigation (Shell suppressed as this is a focused task, but keeping simple header as anchor) -->

    <!-- Main Content - Centered Focused Task -->
    <main class="flex-grow flex p-margin-mobile md:p-margin-desktop">
      <div
        class="w-full bg-surface-container-lowest rounded-xl p-6 md:p-10 flex flex-col gap-8"
      >
        <!-- Header & Progress -->
        <div class="flex flex-col gap-4">
          <div
            class="flex flex-col md:flex-row md:justify-between md:items-end gap-2"
          >
            <h1
              class="font-title-lg text-title-lg text-on-surface md:text-headline-lg"
            >
              Final Quiz: Climate Patterns
            </h1>
            <span class="font-label-md text-label-md text-on-surface-variant"
              >Question 3 of 10</span
            >
          </div>
          <!-- Progress Bar -->
          <div
            aria-valuemax="100"
            aria-valuemin="0"
            aria-valuenow="30"
            class="w-full h-2 bg-surface-container-highest rounded-full overflow-hidden"
            role="progressbar"
          >
            <div
              class="h-full bg-primary rounded-full transition-all duration-500 ease-out"
              style="width: 30%"
            ></div>
          </div>
        </div>
        <!-- Question Area -->
        <div class="flex flex-col gap-6">
          <h2 class="font-body-lg text-body-lg text-on-surface">
            Which of the following is a primary greenhouse gas?
          </h2>
          <!-- Options (Radio Cards) -->
          <form class="flex flex-col gap-4" id="quiz-form">
            <label class="relative cursor-pointer group">
              <input
                class="sr-only radio-card-input"
                name="quiz_q3"
                type="radio"
                value="A"
              />
              <div
                class="radio-card-content flex items-center p-4 rounded-lg border border-outline-variant bg-surface-container-lowest transition-all hover:bg-surface-container-low hover:shadow-sm"
              >
                <div
                  class="radio-circle relative w-5 h-5 rounded-full border-2 border-outline-variant mr-4 flex-shrink-0 transition-colors"
                ></div>
                <span class="font-body-md text-body-md text-on-surface"
                  >Carbon Dioxide</span
                >
              </div>
            </label>
            <label class="relative cursor-pointer group">
              <input
                class="sr-only radio-card-input"
                name="quiz_q3"
                type="radio"
                value="B"
              />
              <div
                class="radio-card-content flex items-center p-4 rounded-lg border border-outline-variant bg-surface-container-lowest transition-all hover:bg-surface-container-low hover:shadow-sm"
              >
                <div
                  class="radio-circle relative w-5 h-5 rounded-full border-2 border-outline-variant mr-4 flex-shrink-0 transition-colors"
                ></div>
                <span class="font-body-md text-body-md text-on-surface"
                  >Oxygen</span
                >
              </div>
            </label>
            <label class="relative cursor-pointer group">
              <input
                class="sr-only radio-card-input"
                name="quiz_q3"
                type="radio"
                value="C"
              />
              <div
                class="radio-card-content flex items-center p-4 rounded-lg border border-outline-variant bg-surface-container-lowest transition-all hover:bg-surface-container-low hover:shadow-sm"
              >
                <div
                  class="radio-circle relative w-5 h-5 rounded-full border-2 border-outline-variant mr-4 flex-shrink-0 transition-colors"
                ></div>
                <span class="font-body-md text-body-md text-on-surface"
                  >Nitrogen</span
                >
              </div>
            </label>
            <label class="relative cursor-pointer group">
              <input
                class="sr-only radio-card-input"
                name="quiz_q3"
                type="radio"
                value="D"
              />
              <div
                class="radio-card-content flex items-center p-4 rounded-lg border border-outline-variant bg-surface-container-lowest transition-all hover:bg-surface-container-low hover:shadow-sm"
              >
                <div
                  class="radio-circle relative w-5 h-5 rounded-full border-2 border-outline-variant mr-4 flex-shrink-0 transition-colors"
                ></div>
                <span class="font-body-md text-body-md text-on-surface"
                  >Argon</span
                >
              </div>
            </label>
          </form>
        </div>
        <!-- Action Buttons -->
        <div
          class="pt-4 mt-2 border-t border-surface-variant flex justify-between items-center"
        >
          <button
            class="px-6 py-2 rounded-lg font-label-lg text-label-lg text-primary hover:bg-primary/5 transition-colors focus:ring-2 focus:ring-primary focus:outline-none"
            onclick="window.location.href='student-learning-view.html'"
            type="button"
          >
            Previous
          </button>
          <button
            class="px-6 py-2 rounded-lg font-label-lg text-label-lg bg-primary text-on-primary shadow-level-1 hover:shadow-level-2 hover:bg-surface-tint transition-all focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:outline-none"
            onclick="window.location.href='student-quiz-result.html'"
            type="button"
          >
            Next
          </button>
        </div>
      </div>
    </main>
    <script>
      // Simple script to handle visual states for keyboard navigation on radio buttons
      const radioInputs = document.querySelectorAll(".radio-card-input");
      radioInputs.forEach((input) => {
        input.addEventListener("change", (e) => {
          // The CSS handles the visual changes, but this allows for custom logic if needed (e.g. enabling the Next button)
          console.log("Selected:", e.target.value);
        });
      });
    </script>
  </body>
</html>
